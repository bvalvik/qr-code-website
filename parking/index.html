<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Parking Payment</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef0f3;
    color: #12212e;
    font-size: 17px;
  }
  .banner {
    background: #b3121b;
    color: #fff;
    text-align: center;
    padding: 14px 16px 16px;
  }
  .banner h1 {
    margin: 0 0 6px;
    font-size: 19px;
    line-height: 1.25;
    font-weight: 700;
  }
  .banner p {
    margin: 0;
    font-size: 14px;
    opacity: .95;
  }
  #clock {
    margin-top: 10px;
    font-family: "Courier New", Courier, monospace;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 22px 16px 40px;
  }
  .card {
    background: #fff;
    border: 1px solid #ccd2d9;
    border-radius: 6px;
    padding: 18px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: #4a5a68;
    margin: 0 0 6px;
  }
  input {
    width: 100%;
    padding: 12px;
    font-size: 17px;
    border: 1px solid #b9c2cb;
    border-radius: 4px;
    margin-bottom: 16px;
    font-family: inherit;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    background: #1b6b2f;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: .5px;
  }
  button:active { background: #145325; }
  #msg {
    margin-top: 14px;
    font-size: 14px;
    color: #b3121b;
    font-weight: 700;
    min-height: 20px;
  }
  .foot {
    margin-top: 22px;
    font-size: 11px;
    line-height: 1.45;
    color: #7d8894;
    text-align: center;
  }
</style>
</head>
<body>

<div class="banner">
  <h1>Parking. Pay for Parking in next 30 Seconds to Avoid Towing</h1>
  <div id="clock">0:30</div>
</div>

<div class="wrap">
  <div class="card">
    <label for="cc">Card Number</label>
    <input id="cc" type="text" inputmode="numeric" autocomplete="off" placeholder="0000 0000 0000 0000">

    <div class="row">
      <div>
        <label for="exp">Exp. Date</label>
        <input id="exp" type="text" inputmode="numeric" autocomplete="off" placeholder="MM/YY">
      </div>
      <div>
        <label for="cvc">Code</label>
        <input id="cvc" type="text" inputmode="numeric" autocomplete="off" placeholder="CVC">
      </div>
    </div>

    <button type="button" id="pay">PAY</button>
    <div id="msg"></div>
  </div>

  <div class="foot">
    Demonstration page for a scam-awareness video. No fields are submitted,
    no data is stored or transmitted anywhere.
  </div>
</div>

<script>
  // Countdown only. Nothing here reads, stores or sends the input fields.
  (function () {
    var left = 30;
    var clock = document.getElementById('clock');
    var msg = document.getElementById('msg');

    function render() {
      var m = Math.floor(left / 60);
      var s = left % 60;
      clock.textContent = m + ':' + (s < 10 ? '0' + s : s);
      if (left <= 10) clock.style.color = '#ffd0d3';
    }
    render();

    var t = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(t);
        left = 0;
        render();
        clock.textContent = '0:00';
        msg.textContent = 'TIME EXPIRED — VEHICLE SUBJECT TO TOW';
        return;
      }
      render();
    }, 1000);

    document.getElementById('pay').addEventListener('click', function () {
      msg.textContent = 'Demo only — no payment was processed.';
    });
  })();
</script>
</body>
</html>
